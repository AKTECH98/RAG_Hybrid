[project]
name = "docrag"
version = "0.1.0"
description = "Production-style RAG over technical docs: hybrid retrieval, reranking, verified citations, evals."
authors = [
    { name = "AKTECH98", email = "anshulkiyawat@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "chromadb>=1.5.9",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "langchain-text-splitters>=1.1.3",
    "numpy>=2.4.6",
    "openai>=3.37.0",
    "pdfplumber>=0.11.10",
    "pydantic-settings>=2.16.1",
    "python-multipart>=0.0.32",
    "rank-bm25>=0.2.2",
    "tiktoken>=0.14.0",
    "uvicorn[standard]>=0.54.0",
]


[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dashboard = [
    "httpx>=0.28.1",
    "streamlit>=1.66.1",
]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
rerank = [
    "sentence-transformers>=6.2.0",
    "torch>=2.14.1",
]

[project.scripts]
docrag = "docrag.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.uv]
# The cross-encoder reranker (torch) is opt-out: `uv sync --no-group rerank` for a slim install.
# The dashboard only talks to the API over HTTP, so its image installs just that group.
default-groups = ["dev", "rerank", "dashboard"]

# Linux (Docker) builds take CPU-only torch: the CUDA wheels add several GB for nothing here.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
